name: Agamemnon
options:
  bundleIdPrefix: com.mirazbakis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "310"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  # Root background helper (Settings ▸ Self-protection). Installed into
  # /Library/PrivilegedHelperTools only when the user asks for it.
  AgamemnonHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    settings:
      base:
        PRODUCT_NAME: AgamemnonHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.mirazbakis.Agamemnon.Helper
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--identifier com.mirazbakis.Agamemnon.Helper"
        SKIP_INSTALL: YES

  Agamemnon:
    type: application
    platform: macOS
    sources:
      - path: App
      # The helper's launchd definition, for SMAppService (Contents/Library/LaunchDaemons).
      - path: Support/LaunchDaemons/com.mirazbakis.Agamemnon.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: AgamemnonHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Agamemnon
        PRODUCT_BUNDLE_IDENTIFIER: com.mirazbakis.Agamemnon
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/Agamemnon.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        DEAD_CODE_STRIPPING: YES
