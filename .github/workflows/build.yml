name: Build DMG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, universal)
        run: |
          set -o pipefail
          xcodebuild \
            -project Agamemnon.xcodeproj \
            -scheme Agamemnon \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      # If Developer ID secrets are set, sign + notarize for a fully trusted DMG.
      # Otherwise the app is ad-hoc signed (users right-click → Open the first time).
      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "${DEVELOPER_ID_P12:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets: making an ad-hoc signed build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Sign app
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Agamemnon.app"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            codesign --force --options runtime --timestamp \
              --entitlements Support/Agamemnon.entitlements \
              --sign "$IDENTITY" "$APP"
          else
            codesign --force --options runtime \
              --entitlements Support/Agamemnon.entitlements \
              --sign - "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Agamemnon"

      - name: Make DMG
        run: |
          set -euo pipefail
          bash scripts/make-dmg.sh build/dd/Build/Products/Release/Agamemnon.app Agamemnon.dmg
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            codesign --force --timestamp --sign "${{ steps.signing.outputs.identity }}" Agamemnon.dmg
          fi

      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit Agamemnon.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple Agamemnon.dmg
          spctl --assess --type open --context context:primary-signature -vv Agamemnon.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          path: Agamemnon.dmg
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Agamemnon.dmg

      # Keeps a public "Nightly build" release pointing at the newest main build.
      - name: Publish nightly build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly
          git push -f origin refs/tags/nightly
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SIGNED="Signed and notarized."
          else
            SIGNED="Ad-hoc signed: the first time you open it, go to System Settings › Privacy & Security and click Open Anyway."
          fi
          NOTES="Latest build of \`main\` (commit ${GITHUB_SHA::7}). ${SIGNED} For stable builds, use the versioned releases."
          gh release delete nightly --yes >/dev/null 2>&1 || true
          gh release create nightly Agamemnon.dmg --prerelease --title "Nightly build" --notes "$NOTES"
